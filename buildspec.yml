version: 0.2

# Build once, pin by digest, deploy that digest everywhere.
#
# 1. Tests and the 80% coverage gate run first; on-failure: ABORT stops the
#    build there, so post_build never pushes an image that failed its tests.
# 2. The image is tagged <env>-<git sha> (immutable per commit) and
#    <env>-latest (only the Terraform-registered bootstrap task definition
#    uses that one).
# 3. scripts/render-deploy-artifacts.sh writes taskdef.json, imageDetail.json,
#    appspec.yml and imagedefinitions.json with the pushed image's digest.
#    CodeDeployToECS (deployment_engine = codedeploy) and the ECS action
#    (deployment_engine = ecs) register a new task-definition revision from
#    them, so test and prod run byte-for-byte the image this build tested.

phases:
  install:
    runtime-versions:
      nodejs: latest
    commands:
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2 &
      - timeout 15 sh -c "until docker info; do echo .; sleep 1; done"
  pre_build:
    on-failure: ABORT
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - echo "region=$AWS_DEFAULT_REGION repo=$ecr_repository_url env=$build_env"
      - REPOSITORY_URI=$ecr_repository_url
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=$build_env-${COMMIT_HASH:-build$CODEBUILD_BUILD_NUMBER}
  build:
    on-failure: ABORT
    commands:
      - echo Build started on `date`
      - cd $CODEBUILD_SRC_DIR/Test_App
      - yarn install --frozen-lockfile
      # Fails the build below 80% line coverage (coverageThreshold in Test_App/package.json)
      - yarn test --coverage
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:$build_env-latest .
  post_build:
    commands:
      - echo Build completed on `date`
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:$build_env-latest
      - IMAGE_URI=$(docker inspect --format='{{index .RepoDigests 0}}' $REPOSITORY_URI:$IMAGE_TAG)
      - echo "Deploying $IMAGE_URI"
      - cd $CODEBUILD_SRC_DIR
      - IMAGE_URI=$IMAGE_URI bash scripts/render-deploy-artifacts.sh
artifacts:
  files:
    - appspec.yml
    - taskdef.json
    - imageDetail.json
    - imagedefinitions.json
